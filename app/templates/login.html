{% extends "base.html" %}
{% block title %}Operator sign-in{% endblock %}
{% block content %}
<section>
  <h1>Operator sign-in</h1>
  <p class="hd-muted">Sign in with your staging operator account to continue.</p>
  {% if message %}<p class="hd-warn">{{ message }}</p>{% endif %}
  <form class="hd-panel" method="post" action="{{ action }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password">
    <button type="submit">Attempt sign-in</button>
  </form>
</section>
{% endblock %}
