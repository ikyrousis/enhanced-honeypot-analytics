<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/logo.png">
<title>{% block title %}Homerdrive Dispatch — staging console{% endblock %}</title>
<style>
/* Maximum Homerdrive staging console — palette sampled from logo.png */
:root {
  --hd-yellow: #ffd90f;
  --hd-blue: #66c7f3;
  --hd-pink: #f16a9c;
  --hd-orange: #f4711f;
  --hd-ink: #14181c;
  --hd-bg: #f7f9fb;
  --hd-panel: #ffffff;
  --hd-line: #d8dee4;
  --hd-muted: #5a6672;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--hd-bg);
  color: var(--hd-ink);
  font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.hd-header { background: var(--hd-ink); color: #fff; }
.hd-header-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hd-logo { height: 60px; width: auto; }
.hd-title { font-weight: 600; letter-spacing: 0.02em; }
.hd-badge {
  background: var(--hd-yellow);
  color: var(--hd-ink);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 2px;
  letter-spacing: 0.08em;
}
.hd-stripe {
  height: 3px;
  background: linear-gradient(90deg, var(--hd-orange) 0 25%, var(--hd-yellow) 25% 55%, var(--hd-blue) 55% 80%, var(--hd-pink) 80% 100%);
}
.hd-main { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; font-weight: 650; }
.hd-muted { color: var(--hd-muted); }
.hd-panel {
  margin-top: 18px;
  background: var(--hd-panel);
  border: 1px solid var(--hd-line);
  border-radius: 3px;
  padding: 16px 18px;
}
.hd-row {
  display: flex;
  gap: 16px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--hd-line);
}
.hd-row:last-child { border-bottom: 0; }
.hd-row > span:first-child { flex: 0 0 160px; }
.hd-warn {
  color: #a4164d;
  border-left: 3px solid var(--hd-pink);
  background: #fdf1f6;
  padding: 8px 12px;
  margin: 12px 0;
}
.hd-warn-text { color: #a4164d; }
.hd-debug summary {
  cursor: pointer;
  color: var(--hd-muted);
  font-size: 12px;
  margin-top: 10px;
}
.hd-debug ul { margin: 8px 0 0; padding-left: 20px; }
a { color: #0b62a8; }
a:focus-visible { outline: 2px solid var(--hd-orange); outline-offset: 2px; }
label { display: block; margin: 12px 0 4px; color: var(--hd-muted); font-size: 13px; }
input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--hd-line);
  border-radius: 3px;
  font: inherit;
  background: #fff;
}
button {
  margin-top: 16px;
  padding: 9px 18px;
  border: 0;
  border-radius: 3px;
  background: var(--hd-yellow);
  color: var(--hd-ink);
  font: 600 13px inherit;
  cursor: pointer;
}
button:hover { filter: brightness(0.96); }
code {
  background: #eef2f5;
  border: 1px solid var(--hd-line);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 12px;
}
.hd-footer {
  max-width: 960px;
  margin: 0 auto;
  padding: 14px 20px 30px;
  color: var(--hd-muted);
  font-size: 12px;
  border-top: 1px solid var(--hd-line);
}
</style>
</head>
<body>
<div class="hd-app">
  <header class="hd-header">
    <div class="hd-header-inner">
      <img src="/static/logo.png" alt="Maximum Homerdrive" class="hd-logo">
      <span class="hd-title">Homerdrive Dispatch</span>
      <span class="hd-badge">STAGING</span>
    </div>
    <div class="hd-stripe" aria-hidden="true"></div>
  </header>
  <main class="hd-main">{% block content %}{% endblock %}</main>
  <footer class="hd-footer">Maximum Homerdrive · internal staging tooling</footer>
</div>
</body>
</html>
